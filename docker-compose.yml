# ─────────────────────────────────────────────────────────────────────────────
# RabbitTech Logistics — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # REVERSE PROXY — Nginx
  # ═══════════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: logistics-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      tracking:
        condition: service_healthy
      web-app:
        condition: service_healthy
    networks:
      - logistics-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # API SERVICE — Express/tRPC  (multi-instance)
  # ═══════════════════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://logistics_service:${DB_PASSWORD}@postgres:5432/logistics?schema=logistics"
      REDIS_URL: "redis://redis:6379/0"
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      STRIPE_SECRET_KEY_PATH: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_PATH: /run/secrets/stripe_webhook_secret
      KAFKA_BROKERS: "kafka:9092"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      LOG_LEVEL: "info"
    secrets:
      - source: jwt_public_key
        target: jwt_public_key
        mode: 0444
      - source: jwt_private_key
        target: jwt_private_key
        mode: 0444
      - source: db_password
        target: db_password
        mode: 0444
      - source: stripe_secret_key
        target: stripe_secret_key
        mode: 0444
      - source: stripe_webhook_secret
        target: stripe_webhook_secret
        mode: 0444
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════════════════
  # TRACKING SERVICE — Socket.IO GPS Ingestion  (multi-instance)
  # ═══════════════════════════════════════════════════════════════════════════
  tracking:
    build:
      context: .
      dockerfile: docker/Dockerfile.tracking
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "postgresql://logistics_service:${DB_PASSWORD}@postgres:5432/logistics?schema=logistics"
      REDIS_URL: "redis://redis:6379/0"
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      BATCH_FLUSH_INTERVAL_MS: "30000"
      BATCH_FLUSH_SIZE: "500"
      OFFLINE_THRESHOLD_MS: "180000"
      LOG_LEVEL: "info"
    secrets:
      - source: jwt_public_key
        target: jwt_public_key
        mode: 0444
      - source: db_password
        target: db_password
        mode: 0444
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════
  # MATCHING SERVICE — Bull Queue Worker
  # ═══════════════════════════════════════════════════════════════════════════
  matching:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      NODE_ENV: production
      WORKER_TYPE: matching
      DATABASE_URL: "postgresql://logistics_service:${DB_PASSWORD}@postgres:5432/logistics?schema=logistics"
      REDIS_URL: "redis://redis:6379/0"
      DEADHEAD_MAX_RATIO: "0.50"
      MATCH_RADIUS_MILES: "150"
      LOG_LEVEL: "info"
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-net

  # ═══════════════════════════════════════════════════════════════════════════
  # NOTIFICATION SERVICE — Bull Queue Worker
  # ═══════════════════════════════════════════════════════════════════════════
  notification:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      NODE_ENV: production
      WORKER_TYPE: notification
      DATABASE_URL: "postgresql://logistics_service:${DB_PASSWORD}@postgres:5432/logistics?schema=logistics"
      REDIS_URL: "redis://redis:6379/0"
      SES_FROM_EMAIL: "${SES_FROM_EMAIL}"
      SES_REGION: "${SES_REGION}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER}"
      FCM_PROJECT_ID: "${FCM_PROJECT_ID}"
      LOG_LEVEL: "info"
    secrets:
      - db_password
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - logistics-net

  # ═══════════════════════════════════════════════════════════════════════════
  # ANALYTICS WORKER — Kafka → Elasticsearch + MV refresh
  # ═══════════════════════════════════════════════════════════════════════════
  analytics:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      NODE_ENV: production
      WORKER_TYPE: analytics
      DATABASE_URL: "postgresql://logistics_service:${DB_PASSWORD}@postgres:5432/logistics?schema=logistics"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BROKERS: "kafka:9092"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      LOG_LEVEL: "info"
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - logistics-net

  # ═══════════════════════════════════════════════════════════════════════════
  # PAYMENT WORKER — Scheduled carrier payouts
  # ═══════════════════════════════════════════════════════════════════════════
  payment:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      NODE_ENV: production
      WORKER_TYPE: payment
      DATABASE_URL: "postgresql://logistics_service:${DB_PASSWORD}@postgres:5432/logistics?schema=logistics"
      REDIS_URL: "redis://redis:6379/0"
      STRIPE_SECRET_KEY_PATH: /run/secrets/stripe_secret_key
      LOG_LEVEL: "info"
    secrets:
      - source: db_password
        target: db_password
        mode: 0444
      - source: stripe_secret_key
        target: stripe_secret_key
        mode: 0444
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-net

  # ═══════════════════════════════════════════════════════════════════════════
  # RESERVATION EXPIRY WORKER — Reclaims stale slot reservations
  # ═══════════════════════════════════════════════════════════════════════════
  reservation-expiry:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      NODE_ENV: production
      WORKER_TYPE: reservation-expiry
      DATABASE_URL: "postgresql://logistics_service:${DB_PASSWORD}@postgres:5432/logistics?schema=logistics"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "info"
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-net

  # ═══════════════════════════════════════════════════════════════════════════
  # POSTGRESQL + PostGIS
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: logistics-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"    # Remapped to avoid local PG conflict
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics_service
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations/002_multi_truck_booking.sql:/docker-entrypoint-initdb.d/02-multi-truck-booking.sql:ro
      - ./docker/seed-data.sql:/docker-entrypoint-initdb.d/03-seed-data.sql:ro
    networks:
      - logistics-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c max_connections=500
        -c max_wal_size=2GB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c wal_level=replica
        -c max_wal_senders=3
        -c log_min_duration_statement=200
        -c log_checkpoints=on
        -c log_connections=on
        -c log_disconnections=on
        -c log_lock_waits=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics_service -d logistics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # REDIS — Caching, Pub/Sub, Job Queues, GPS Hot-Store
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7.4-alpine
    container_name: logistics-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - logistics-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 384mb
        --maxmemory-policy noeviction
        --tcp-keepalive 60
        --timeout 300
        --save 900 1
        --save 300 10
        --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # KAFKA (KRaft mode — no Zookeeper)
  # ═══════════════════════════════════════════════════════════════════════════
  kafka:
    image: apache/kafka:3.9.0
    container_name: logistics-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - logistics-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # ELASTICSEARCH — Load board search + analytics
  # ═══════════════════════════════════════════════════════════════════════════
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0
    container_name: logistics-elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: logistics
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - logistics-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # WEB APP — Next.js Frontend
  # ═══════════════════════════════════════════════════════════════════════════
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: logistics-web-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "https://localhost"
      NEXT_PUBLIC_WS_URL: "https://localhost"
    networks:
      - logistics-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

# ═══════════════════════════════════════════════════════════════════════════
# SECRETS — File-based; mount from CI/CD vault in production
# ═══════════════════════════════════════════════════════════════════════════
secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_public_key:
    file: ./secrets/jwt_public.pem
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  es-data:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════
# NETWORK
# ═══════════════════════════════════════════════════════════════════════════
networks:
  logistics-net:
    driver: bridge
