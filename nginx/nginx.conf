# ─────────────────────────────────────────────
# Main nginx.conf — L7 Reverse Proxy
# WebSocket upgrade + TLS termination
# ─────────────────────────────────────────────

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ── Security Headers ─────────────────────────────────────────────────
    server_tokens off;

    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Rate Limiting ────────────────────────────────────────────────────
    # Zone: 10 MB shared memory ≈ 160,000 IP addresses
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=60r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=5r/s;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # ── Upstream: API Service (round-robin across replicas) ──────────────
    upstream api_backend {
        least_conn;
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── Upstream: Tracking Service (WebSocket, ip_hash for affinity) ─────
    upstream tracking_backend {
        # ip_hash for Socket.IO polling fallback session affinity
        # (not needed for pure WebSocket, but Socket.IO handshake starts via HTTP)
        ip_hash;
        server tracking:3001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ── Upstream: Frontend (Next.js) ────────────────────────────────────
    upstream frontend {
        server web-app:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ═════════════════════════════════════════════════════════════════════
    # HTTP → HTTPS redirect
    # ═════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # Health check endpoint (no redirect)
        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ACME challenge for cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═════════════════════════════════════════════════════════════════════
    # HTTPS — Main TLS server
    # ═════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name _;

        # ── TLS ──────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Request Size Limits ──────────────────────────────────────────
        client_max_body_size 10m;

        # ── API Routes ───────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # ── Auth Routes (stricter rate limit) ────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # ── WebSocket / Socket.IO (Tracking) ─────────────────────────────
        location /ws/ {
            limit_req zone=ws_limit burst=20 nodelay;

            proxy_pass http://tracking_backend;
            proxy_http_version 1.1;

            # ─── WebSocket Upgrade ───────────────────────────────────────
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived connections — 1 hour idle timeout
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        # ── Health Check (internal) ──────────────────────────────────────
        location = /health {
            access_log off;
            proxy_pass http://api_backend/health;
        }

        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Root / catch-all → proxy to Frontend ─────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # ── Block common exploit paths ───────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ^/(wp-admin|wp-login|phpmyadmin|\.env) {
            deny all;
            access_log off;
        }
    }
}
