# ─────────────────────────────────────────────────────────────────────────────
# Service Accounts — least-privilege RBAC for each service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logistics-api
  namespace: logistics
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::role/logistics-api"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logistics-tracking
  namespace: logistics
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logistics-worker
  namespace: logistics
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::role/logistics-worker"
automountServiceAccountToken: false
