# ─────────────────────────────────────────────────────────────────────────────
# External Secrets — production source of truth for application secrets
# Requires External Secrets Operator plus AWS Secrets Manager.
# The generated secret keeps the existing name `logistics-secrets` so the
# Deployments do not need to change their secretKeyRef wiring.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: logistics-secrets
  namespace: logistics
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: logistics-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: rabbittech/logistics/production/app
        property: DB_PASSWORD
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: rabbittech/logistics/production/app
        property: JWT_PRIVATE_KEY
    - secretKey: JWT_PRIVATE_KEYS
      remoteRef:
        key: rabbittech/logistics/production/app
        property: JWT_PRIVATE_KEYS
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: rabbittech/logistics/production/app
        property: JWT_PUBLIC_KEY
    - secretKey: JWT_PUBLIC_KEYS
      remoteRef:
        key: rabbittech/logistics/production/app
        property: JWT_PUBLIC_KEYS
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: rabbittech/logistics/production/app
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: rabbittech/logistics/production/app
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef:
        key: rabbittech/logistics/production/app
        property: KAFKA_SASL_PASSWORD
    - secretKey: ELASTICSEARCH_API_KEY
      remoteRef:
        key: rabbittech/logistics/production/app
        property: ELASTICSEARCH_API_KEY
