# ─────────────────────────────────────────────────────────────────────────────
# Pod Disruption Budgets — ensure availability during node maintenance
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: logistics
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tracking-pdb
  namespace: logistics
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tracking
